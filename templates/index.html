{% extends "base.html" %}
{% block content %}
<div class="panel">
    <h1>Choose an event</h1>
    <form method="post" action="{{ url_for('perform') }}">
        <div class="row">
            <label for="kind">Event Type:</label>
            <select name="kind" id="kind" onchange="showFields()">
                <option value="coin">Coin Flip</option>
                <option value="die">Die Roll</option>
            </select>
        </div>
        <div>
            <label>Times to run</label>
            <input type="number" name="times" min="1" max="100" value="1" required>

        </div>
        <div id ="options-coin" class="opts">
            <label>P(Heads)</label>
            <input type="number" step="0.01" min="0" max="1" name="p_heads" value="0.5">
        </div>
        <div id="options-die" class="opts" style="display:none;">
            <label>Number of faces</label>
            <input type="number" name="faces" min="4" max="100" value="6">
        </div>
        
        <label style="margin-top:1rem">
            <input type="checkbox" name="track" checked>
            Track this event in history
        </label>

        <div style="margin-top:1rem">
            <button type="submit">Run it</button>
        </div>
    </form>
</div>

<script> 
function showFields() {
    const kind = document.getElementById("kind").value;
    document.querySelectorAll(".opts").forEach(el => el.style.display = "none");
    const target = document.getElementById("options-" + kind);
    if (target) target.style.display = "";
}    
showFields();
</script>
{% endblock %}
